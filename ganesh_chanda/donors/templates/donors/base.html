<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganesh Chanda</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  {% load static %}
  <style>
    body {
      font-family: 'Poppins', sans-serif !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      background: url('{% static "images/ganesh_bg.png" %}') center center / cover no-repeat fixed;
      position: relative;
    }

    /* Overlay for readability */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 0;
    }

    .container {
      flex: 1; /* main content grows to fill space */
      position: relative;
      z-index: 1;
    }

    .content-box {
      background: rgba(255,255,255,0.85);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }

    h2, h3, .navbar-brand {
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Navbar styling */
    .navbar {
      position: relative;
      z-index: 2;
    }
    .navbar-nav .nav-link {
      transition: color 0.3s ease, transform 0.2s ease;
    }
    .navbar-nav .nav-link:hover {
      color: #ffd54f !important;
      transform: scale(1.05);
    }

    /* Footer always at bottom */
    footer {
      background: rgba(0,0,0,0.6);
      color: #fff;
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow" 
       style="background: linear-gradient(90deg, #ff9800, #e91e63);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-light" href="/">
        <i class="bi bi-flower1"></i> Ganesh Chanda
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-light" href="/donate/"><i class="bi bi-cash-stack"></i> Donate</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="/donors/"><i class="bi bi-people-fill"></i> Donors</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="/admin/"><i class="bi bi-gear-fill"></i> Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer>
    © 2026 Ganesh Chanda | Made with devotion and technology
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
